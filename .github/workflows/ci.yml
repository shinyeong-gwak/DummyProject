name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-api-jar
          path: build/libs/*.jar
      - name: Build Docker image
        run: docker build -t dummy-api:test .
      - name: Run container and verify API
        shell: bash
        run: |
          docker run -d --name dummy-api -p 8080:8080 dummy-api:test
          trap 'docker logs dummy-api; docker rm -f dummy-api' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          curl --fail http://localhost:8080/api/hello
